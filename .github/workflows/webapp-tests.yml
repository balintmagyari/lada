name: Webapp tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'webapp/**'
      - 'src/**'
      - '.github/workflows/webapp-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'webapp/**'
      - 'src/**'
      - '.github/workflows/webapp-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e . -e "./webapp[dev]"

    - name: Lint
      run: ruff check webapp/src webapp/tests

    - name: Format check
      run: ruff format --check webapp/src webapp/tests

    - name: Run tests
      run: |
        cd webapp
        python -m pytest -q
