[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lada"
version = "1.0.6"
authors = [
  { name="Balint Magyari", email="balint.magyari@unina.it" },
]
description = "LAMMPS Data Access library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=3.0",
  "tqdm>=4.60"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = { text = "MIT" }

# Testing tools, not required to be installed for regular users
[project.optional-dependencies]
dev = [
    "pytest",
    "icecream",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "SIM105",  # contextlib.suppress is less readable than try-except-pass for silent conversions
    "SIM108",  # ternary operator is less readable than if-else for multi-line assignments
    "SIM114",  # combining elif branches with 'or' reduces clarity here
]

[project.urls]
Homepage = "https://github.com/balintmagyari/lada"