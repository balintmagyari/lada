services:
  web:
    # The repository root is the context so the image can install lada from src/ (see Dockerfile).
    build:
      context: ..
      dockerfile: webapp/Dockerfile
    restart: unless-stopped
    # The image trusts X-Forwarded-* from any peer (see the Dockerfile CMD), so this port is
    # meant for a reverse proxy on the same host or network, not for the open internet.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LADA_WEB_MAX_UPLOAD_MB: "50"
      LADA_WEB_MAX_FILES_PER_REQUEST: "10"
      WEB_CONCURRENCY: "2"
      # Point every workspace at the tmpfs, so uploads never touch the writable layer.
      LADA_WEB_TEMP_ROOT: "/tmp/lada-web"
    # Uploads land in /tmp twice: Starlette spools the multipart file part there while it parses
    # the form, and `save_upload` then writes its own copy into the request workspace. The
    # largest import (10 files of 50 MB) therefore needs ~1 GB; real rheometer exports are a few
    # MB, so this is a ceiling, not the usual load. Raise it with either upload setting.
    tmpfs:
      - /tmp:size=1100m,mode=1777
    # The full tmpfs plus two workers of ~250 MB each (interpreter, NumPy, pandas, matplotlib).
    mem_limit: 2g
