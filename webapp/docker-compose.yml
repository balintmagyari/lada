services:
  web:
    build: .
    restart: unless-stopped
    # The image trusts X-Forwarded-* from any peer (see the Dockerfile CMD), so this port is
    # meant for a reverse proxy on the same host or network, not for the open internet.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LADA_WEB_MAX_UPLOAD_MB: "50"
      LADA_WEB_MAX_TRAJECTORY_MB: "500"
      LADA_WEB_MAX_TRAJECTORY_FRAMES: "3000"
      # Lowered from the 2048 MB default so two workers still fit inside mem_limit below.
      LADA_WEB_MAX_TRAJECTORY_MEMORY_MB: "1024"
      LADA_WEB_MAX_TABLE_ROWS: "500"
      # Point every workspace at the tmpfs, so uploads never touch the writable layer.
      LADA_WEB_TEMP_ROOT: "/tmp/lada-web"
    # Uploads land in /tmp twice: Starlette spools the multipart file part there while it
    # parses the form, and `save_upload` then writes its own copy into the request workspace.
    # One 500 MB trajectory therefore needs ~1 GB, and a tmpfs keeps all of it in memory and
    # out of the container's writable layer, where a large upload could otherwise fill the
    # disk. Raise this together with LADA_WEB_MAX_TRAJECTORY_MB, and mem_limit with both.
    tmpfs:
      - /tmp:size=1200m,mode=1777
    # 1.2 GB of tmpfs plus two workers holding up to 1 GB of decompressed trajectory each,
    # plus the interpreter and NumPy. Every one of those three numbers moves this one.
    mem_limit: 4g
